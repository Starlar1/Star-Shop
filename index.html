<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>Star Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== DOUBLE VIDEO FOR CROSSFADE ===== -->
<video id="bgVideoA" class="bgVideo active" autoplay muted playsinline preload="auto"></video>
<video id="bgVideoB" class="bgVideo" muted playsinline preload="auto"></video>

<div class="videoOverlay"></div>

<!-- ===== HOME SCREEN ===== -->
<div id="homeScreen">

    <div class="heartBalance">
        <i class="fa-solid fa-heart"></i>
        <span>0</span>
    </div>

    <div class="homeTop">
        <button class="settingButton" onclick="handleButtonClick('settingsScreen')">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <div class="homeContent">

        <button class="buyButton" onclick="handleButtonClick('diamondsScreen')">
            <i class="fa-solid fa-gem"></i>
            <span>ဝယ်ယူမည်</span>
        </button>

        <div class="bottomMenu">
            <button class="menuButton active" onclick="handleButtonClick('homeNewScreen')">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="menuButton" onclick="handleButtonClick('chatScreen')">
                <i class="fa-solid fa-comments"></i>
                <span>Chat</span>
            </button>
            <button class="menuButton" onclick="handleButtonClick('historyScreen')">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>မှတ်တမ်း</span>
            </button>
            <button class="menuButton" onclick="handleButtonClick('faqScreen')">
                <i class="fa-solid fa-circle-question"></i>
                <span>FAQ</span>
            </button>
        </div>
    </div>

    <!-- ===== CHAT BUBBLE OVERLAY ===== -->
    <div id="chatBubble" class="chat-bubble hidden">
        <div class="bubble-content">
            <div class="bubble-text" id="bubbleText"></div>
            <div class="bubble-actions">
                <button class="bubble-btn secondary" onclick="bubbleBack()">Back</button>
                <button class="bubble-btn primary" onclick="bubbleBuy()">ဝယ်ယူမည်</button>
            </div>
        </div>
    </div>

</div>

<!-- ===== OTHER SCREENS ===== -->
<div id="homeNewScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">Home</div>
    </div>
    <div class="screenBody"><div class="emptyArea"></div></div>
</div>

<div id="diamondsScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">ဝယ်ယူမည်</div>
    </div>
    <div class="screenBody" id="diamondsBody"></div>
</div>

<div id="chatScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">Chat</div>
    </div>
    <div class="screenBody"><div class="emptyArea"></div></div>
</div>

<div id="historyScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">မှတ်တမ်း</div>
    </div>
    <div class="screenBody"><div class="emptyArea"></div></div>
</div>

<div id="faqScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">FAQ</div>
    </div>
    <div class="screenBody"><div class="emptyArea"></div></div>
</div>

<div id="settingsScreen" class="screen">
    <div class="screenHeader">
        <button class="backButton" onclick="showHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="screenTitle">Setting</div>
    </div>
    <div class="screenBody" id="settingsBody"></div>
</div>

<!-- ===== ORDER POPUP ===== -->
<div id="orderPopup" class="order-popup hidden">
    <div class="popup-content">

        <div class="popup-header">
            <div class="popup-title">ဝယ်ယူမည်</div>
            <button class="popup-close" onclick="closeOrderPopup()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="popup-body">

            <div class="popup-item">
                <i class="fa-solid fa-gem"></i>
                <span id="popupItemName">-</span>
            </div>

            <div class="popup-price" id="popupItemPrice">-</div>

            <div class="payment-info" onclick="copyText('09999999999')">
                <i class="fa-solid fa-copy"></i>
                <div>
                    <div class="pay-name">Wave Money</div>
                    <div class="pay-num">09999999999</div>
                </div>
            </div>

            <div class="payment-info" onclick="copyText('09888888888')">
                <i class="fa-solid fa-copy"></i>
                <div>
                    <div class="pay-name">Kpay</div>
                    <div class="pay-num">09888888888</div>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Game ID</label>
                <input type="text" id="inputGameId" placeholder="Game ID ထည့်ပါ" />
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-server"></i> Server ID</label>
                <input type="text" id="inputServerId" placeholder="Server ID ထည့်ပါ" />
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-camera"></i> ငွေလွဲအတည်ပြုဓာတ်ပုံ</label>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('inputImage').click()">
                    <i class="fa-solid fa-image"></i>
                    <p>ပုံထည့်ရန် နှိပ်ပါ</p>
                </div>
                <input type="file" id="inputImage" accept="image/*" hidden />
                <div id="imagePreview" class="image-preview hidden">
                    <img id="previewImg" src="" alt="preview">
                    <button class="remove-img" onclick="removeImage()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitOrder()">
                <i class="fa-solid fa-paper-plane"></i>
                <span>ပေးပို့မည်</span>
            </button>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html><style>/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Inter", sans-serif;
    background: #000;
    color: #fff;
}

/* =========================================================
   DOUBLE VIDEO
========================================================= */
.bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    background: transparent;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
}

.bgVideo.active { opacity: 1; z-index: 1; }

.videoOverlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(0,0,0,0.10) 0%,
        rgba(0,0,0,0.03) 35%,
        rgba(0,0,0,0.45) 100%
    );
}

/* =========================================================
   HOME
========================================================= */
#homeScreen {
    position: fixed;
    inset: 0;
    z-index: 5;
}

.heartBalance {
    position: absolute;
    top: 18px;
    left: 18px;
    height: 38px;
    min-width: 68px;
    padding: 0 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.26);
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.055));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.16);
    z-index: 20;
}

.heartBalance i { color: #ff6684; font-size: 14px; }
.heartBalance span { color: #fff; font-size: 11px; font-weight: 700; }

.homeTop {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 20;
}

.settingButton {
    width: 39px;
    height: 39px;
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.18);
    cursor: pointer;
    transition: .2s;
}

.settingButton:active { transform: scale(.92); }

.homeContent {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 74px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.buyButton {
    position: relative;
    width: 240px;
    height: 42px;
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(255,255,255,0.24), rgba(255,255,255,0.07));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    box-shadow: 0 12px 35px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.20);
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s;
}

.buyButton::before {
    content: "";
    position: absolute;
    top: 0; left: -110%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.17), transparent);
    transform: skewX(-20deg);
    animation: buyShine 5s infinite;
}

@keyframes buyShine {
    0% { left: -110%; }
    45%, 100% { left: 140%; }
}

.buyButton i, .buyButton span { position: relative; z-index: 2; }
.buyButton i { font-size: 11px; }
.buyButton:active { transform: scale(.95); }

.bottomMenu {
    width: 86vw;
    max-width: 350px;
    height: 46px;
    padding: 3px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    border-radius: 15px;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.055));
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 12px 38px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.17);
}

.menuButton {
    position: relative;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: rgba(255,255,255,0.72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: inherit;
    font-size: 6.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s, transform .2s;
}

.menuButton i { font-size: 11px; }

.menuButton.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.08));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
}

.menuButton:active { transform: scale(.91); }

/* =========================================================
   CHAT BUBBLE
========================================================= */
.chat-bubble {
    position: fixed;
    left: 50%;
    bottom: 140px;
    transform: translateX(-50%);
    z-index: 30;
    width: 86vw;
    max-width: 340px;
    animation: bubbleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.chat-bubble.hidden { display: none; }

@keyframes bubbleIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

.bubble-content {
    background: linear-gradient(135deg, rgba(255,142,170,0.30), rgba(255,107,145,0.20));
    border: 1px solid rgba(255,142,170,0.50);
    border-radius: 20px;
    padding: 16px 18px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 12px 40px rgba(255,75,120,0.30), inset 0 1px 0 rgba(255,255,255,0.20);
    position: relative;
}

.bubble-content::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 12px solid rgba(255,142,170,0.30);
}

.bubble-text {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.30);
}

.bubble-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.bubble-btn {
    padding: 10px 12px;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s;
}

.bubble-btn.secondary {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
}

.bubble-btn.primary {
    background: linear-gradient(135deg, #ff8eaa, #ff587f);
    color: #fff;
    box-shadow: 0 6px 20px rgba(255,75,120,0.40);
}

.bubble-btn:active { transform: scale(.94); }

/* =========================================================
   ALL SCREENS
========================================================= */
.screen {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(7,7,12,0.82), rgba(0,0,0,0.94));
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.screen.active { display: flex; }

.screenHeader {
    width: 100%;
    min-height: 62px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.045);
    border-bottom: 1px solid rgba(255,255,255,0.10);
    flex-shrink: 0;
}

.backButton {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.20);
    background: rgba(255,255,255,0.09);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
}

.backButton:active { transform: scale(.90); }

.screenTitle {
    margin-left: 12px;
    font-size: 15px;
    font-weight: 700;
}

.screenBody {
    flex: 1;
    width: 100%;
    padding: 18px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.emptyArea { width: 100%; min-height: 100%; }

/* =========================================================
   SECTION / GRID
========================================================= */
.mm-section { margin-bottom: 22px; }

.mm-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,142,170,0.20), rgba(255,107,145,0.10));
    border: 1px solid rgba(255,142,170,0.30);
    box-shadow: 0 4px 15px rgba(255,107,145,0.10);
}

.mm-section-title i {
    color: #ff8eaa;
    font-size: 14px;
}

.mm-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
}

.mm-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform .2s;
}

.mm-card:active { transform: scale(.95); }

.mm-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: rgba(0,0,0,0.20);
    display: block;
}

.mm-card-info {
    padding: 6px 4px;
    text-align: center;
    background: rgba(255,255,255,0.06);
}

.mm-card-name {
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 3px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.mm-card-price {
    font-size: 9px;
    font-weight: 700;
    color: #ff8eaa;
}

/* =========================================================
   SETTINGS
========================================================= */
.settings-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}

.settings-card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
}

.settings-card-title i { color: #ff8eaa; font-size: 14px; }

.settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.settings-row:last-child { border-bottom: none; }

.settings-row .label {
    display: flex;
    align-items: center;
    gap: 6px;
}

.settings-row .label i {
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    width: 14px;
}

.settings-row .value {
    font-weight: 700;
    color: #ff8eaa;
}

.settings-button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .2s;
}

.settings-button.primary {
    background: linear-gradient(135deg, #ff8eaa, #ff587f);
    color: #fff;
    box-shadow: 0 8px 25px rgba(255,75,120,0.30);
}

.settings-button.danger {
    background: linear-gradient(135deg, rgba(255,75,75,0.20), rgba(255,45,45,0.10));
    border: 1px solid rgba(255,75,75,0.35);
    color: #ff8888;
}

.settings-button:active { transform: scale(.97); }

/* =========================================================
   ORDER POPUP
========================================================= */
.order-popup {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.80);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 18px;
    animation: fadeIn 0.3s ease;
}

.order-popup.hidden { display: none; }

@keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

.popup-content {
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1a22, #0a0a10);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

.popup-header {
    padding: 16px 18px;
    background: linear-gradient(135deg, #ff8eaa, #ff587f);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

.popup-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
}

.popup-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.20);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
}

.popup-close:active { transform: rotate(90deg) scale(.92); }

.popup-body {
    padding: 18px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}

.popup-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,142,170,0.10);
    border: 1px solid rgba(255,142,170,0.25);
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
}

.popup-item i { color: #ff8eaa; }

.popup-price {
    font-size: 18px;
    font-weight: 800;
    color: #ff8eaa;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    margin-bottom: 14px;
}

.payment-info {
    display: flex;

/* =========================================================
   INDEXEDDB
========================================================= */
const DB_NAME    = "StarShopDB";
const DB_VERSION = 1;
const STORE_NAME = "resources";
let dbInstance = null;

function openDB() {
    return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: "url" });
            }
        };
        request.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
        request.onerror   = (e) => reject(e.target.error);
    });
}

async function getResourceFromDB(url) {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get(url);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror   = () => reject(req.error);
        });
    } catch (e) { return null; }
}

async function saveResourceToDB(url, blob) {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            const req = tx.objectStore(STORE_NAME).put({
                url, blob, size: blob.size, savedAt: Date.now()
            });
            req.onsuccess = () => resolve(true);
            req.onerror   = () => reject(req.error);
        });
    } catch (e) { return false; }
}

async function getAllResourcesFromDB() {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror   = () => reject(req.error);
        });
    } catch (e) { return []; }
}

async function clearAllResourcesFromDB() {
    try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            const req = tx.objectStore(STORE_NAME).clear();
            req.onsuccess = () => resolve(true);
            req.onerror   = () => reject(req.error);
        });
    } catch (e) { return false; }
}

/* =========================================================
   RESOURCE CACHE
========================================================= */
const resourceCache = {};

async function getResourceBlobURL(url) {
    if (resourceCache[url]) return resourceCache[url];
    const record = await getResourceFromDB(url);
    if (record && record.blob) {
        const blobURL = URL.createObjectURL(record.blob);
        resourceCache[url] = blobURL;
        return blobURL;
    }
    return url;
}

/* =========================================================
   CROSSFADE PLAYER
========================================================= */
let currentVideo = videoA;
let standbyVideo = videoB;

async function crossfadeTo(url, { loop = true } = {}) {
    if (currentURL === url) return;

    const blobURL = await getResourceBlobURL(url);

    standbyVideo.loop = loop;
    standbyVideo.src = blobURL;
    standbyVideo.currentTime = 0;
    standbyVideo.load();

    await new Promise((resolve) => {
        const onReady = () => {
            standbyVideo.removeEventListener("canplay", onReady);
            resolve();
        };
        if (standbyVideo.readyState >= 3) resolve();
        else {
            standbyVideo.addEventListener("canplay", onReady);
            setTimeout(resolve, 1500);
        }
    });

    try { await standbyVideo.play(); } catch (e) {}

    standbyVideo.classList.add("active");
    currentVideo.classList.remove("active");

    setTimeout(() => {
        try { currentVideo.pause(); } catch (e) {}
        const tmp = currentVideo;
        currentVideo = standbyVideo;
        standbyVideo = tmp;
        currentURL = url;
    }, 400);
}

/* =========================================================
   VIDEO FLOW
========================================================= */
async function playRandomVideo() {
    const idx = Math.floor(Math.random() * RANDOM_VIDEOS.length);
    await crossfadeTo(RANDOM_VIDEOS[idx], { loop: true });
}

async function handleFirstTap() {
    if (introPlayed) return;
    introPlayed = true;

    await crossfadeTo(INTRO_VIDEO, { loop: false });

    currentVideo.onended = async () => {
        await crossfadeTo(LOOP_VIDEO, { loop: true });
        tapLocked = false;
    };

    setTimeout(() => {
        if (tapLocked) {
            tapLocked = false;
            crossfadeTo(LOOP_VIDEO, { loop: true });
        }
    }, 15000);
}

/* =========================================================
   DOWNLOAD ALL RESOURCES
========================================================= */
async function cacheAllResources() {
    for (const url of ALL_VIDEO_URLS) {
        try {
            const existing = await getResourceFromDB(url);
            if (existing && existing.blob) {
                if (!resourceCache[url]) {
                    resourceCache[url] = URL.createObjectURL(existing.blob);
                }
                continue;
            }
            const response = await fetch(url, { mode: "cors" });
            if (!response.ok) continue;
            const blob = await response.blob();
            await saveResourceToDB(url, blob);
            resourceCache[url] = URL.createObjectURL(blob);
        } catch (e) {}
    }
}

        document.getElementById("uploadArea").style.display = "none";
    };
    reader.readAsDataURL(file);
});

/* =========================================================
   COPY TO CLIPBOARD
========================================================= */
function copyText(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            showToast("Copy လုပ်ပြီးပါပြီ -- " + text);
        }).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand("copy");
        showToast("Copy လုပ်ပြီးပါပြီ -- " + text);
    } catch (e) {
        showToast("Copy မလုပ်နိုင်ပါ");
    }
    document.body.removeChild(ta);
}

/* =========================================================
   TOAST
========================================================= */
function showToast(msg) {
    let t = document.querySelector(".toast");
    if (!t) {
        t = document.createElement("div");
        t.className = "toast";
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

   SUBMIT ORDER TO TELEGRAM
========================================================= */
async function submitOrder() {
    const gameId   = document.getElementById("inputGameId").value.trim();
    const serverId = document.getElementById("inputServerId").value.trim();

    if (!gameId)   { showToast("Game ID ထည့်ပါ"); return; }
    if (!serverId) { showToast("Server ID ထည့်ပါ"); return; }
    if (!uploadedImage) { showToast("ငွေလွဲအတည်ပြုဓာတ်ပုံ ထည့်ပါ"); return; }

    const btn = document.getElementById("submitBtn");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ပေးပို့နေသည်...';

    try {
        const now = new Date();
        const time12 = now.toLocaleString("en-US", {
            year: "numeric", month: "short", day: "numeric",
            hour: "2-digit", minute: "2-digit", hour12: true
        });

        const caption =
`🛒 New Order

📦 Item: ${selectedItem.name}
💰 Price: ${selectedItem.price}
🎮 Game ID: ${gameId}
🔢 Server ID: ${serverId}
🕒 Time: ${time12}`;

        const blob = dataURLtoBlob(uploadedImage);
        const formData = new FormData();
        formData.append("chat_id", GROUP_ID);
        formData.append("photo", blob, "payment.jpg");
        formData.append("caption", caption);

        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.ok) {
            showToast("✅ Order အောင်မြင်ပါသည်");
            setTimeout(() => {
                closeOrderPopup();
            }, 1200);
        } else {
            showToast("❌ ပေးပို့မှု မအောင်မြင်ပါ");
        }
    } catch (e) {
        showToast("❌ Error -- ထပ်ကြိုးစားပါ");
    } finally {
        btn.disabled = false;
        btn.innerHTML = original;
    }
}

function dataURLtoBlob(dataURL) {
    const arr = dataURL.split(",");
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: mime });
}

/* =========================================================
   SETTINGS PAGE
========================================================= */
async function renderSettings() {
    const body = document.getElementById("settingsBody");
    if (!body) return;

    const cachedRecords = await getAllResourcesFromDB();
    const cachedUrls = cachedRecords.map(r => r.url);

    let totalSize = 0;
    cachedRecords.forEach(r => { totalSize += (r.size || 0); });
    const sizeMB = (totalSize / (1024 * 1024)).toFixed(2);

    let cachedRows = "";
    ALL_VIDEO_URLS.forEach((url, i) => {
        const isCached = cachedUrls.includes(url);
        const statusIcon = isCached
            ? '<i class="fa-solid fa-circle-check" style="color:#6ee7a7;"></i>'
            : '<i class="fa-solid fa-circle-xmark" style="color:#ff8888;"></i>';
        const statusText = isCached ? "Downloaded" : "Not downloaded";

        cachedRows += `
            <div class="settings-row">
                <div class="label">${statusIcon}<span>Resource ${i + 1}</span></div>
                <div class="value" style="font-size:10px;font-weight:600;">${statusText}</div>
            </div>
        `;
    });

    const totalVideos = ALL_VIDEO_URLS.length;
    const cachedCount = cachedUrls.length;
    const availCount  = totalVideos - cachedCount;

    body.innerHTML = `
        <div class="settings-card">
            <div class="settings-card-title">
                <i class="fa-solid fa-database"></i>
                <span>Storage Info</span>
            </div>
            <div class="settings-row">
                <div class="label"><i class="fa-solid fa-layer-group"></i><span>Total Resources</span></div>
                <div class="value">${totalVideos}</div>
            </div>
            <div class="settings-row">
                <div class="label"><i class="fa-solid fa-download"></i><span>Downloaded</span></div>
                <div class="value">${cachedCount}</div>
            </div>
            <div class="settings-row">
                <div class="label"><i class="fa-solid fa-cloud"></i><span>Available</span></div>
                <div class="value">${availCount}</div>
            </div>
            <div class="settings-row">
                <div class="label"><i class="fa-solid fa-hard-drive"></i><span>Total Size</span></div>
                <div class="value">${sizeMB} MB</div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-card-title">
                <i class="fa-solid fa-list-check"></i>
                <span>Resource Status</span>
            </div>
            ${cachedRows}
        </div>

        <div class="settings-card">
            <div class="settings-card-title">
                <i class="fa-solid fa-bolt"></i>
                <span>Actions</span>
            </div>
            <button class="settings-button primary" onclick="manualCacheAll()">
                <i class="fa-solid fa-cloud-arrow-down"></i> All Data Download
            </button>
            <button class="settings-button danger" onclick="manualClearAll()">
                <i class="fa-solid fa-trash-can"></i> All Data Clear
            </button>
        </div>
    `;
}

async function manualCacheAll() {
    showToast("Downloading...");
    await cacheAllResources();
    showToast("✅ Download ပြီးပါပြီ");
    renderSettings();
}

async function manualClearAll() {
    if (!confirm("Are you sure you want to clear all cached data?")) return;
    Object.values(resourceCache).forEach(url => {
        try { URL.revokeObjectURL(url); } catch (e) {}
    });
    Object.keys(resourceCache).forEach(k => delete resourceCache[k]);
    await clearAllResourcesFromDB();
    showToast("✅ Clear ပြီးပါပြီ");
    renderSettings();
}

function showScreen(screenId) {
    if (tapLocked) return;

    // Hide bubble if open
    document.getElementById("chatBubble").classList.add("hidden");

    document.getElementById("homeScreen").style.display = "none";
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

    const target = document.getElementById(screenId);
    if (target) target.classList.add("active");

    if (screenId === "settingsScreen") renderSettings();
}

function showHome() {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById("homeScreen").style.display = "block";

    // Restore buy + bottom
    document.querySelector(".buyButton").style.display = "flex";
    document.querySelector(".bottomMenu").style.display = "grid";

    // Hide bubble
    document.getElementById("chatBubble").classList.add("hidden");

    // Back to loop video
    crossfadeTo(LOOP_VIDEO, { loop: true });

    selectedItem = null;
}
